services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Express"
    networks: [devNetwork]
    ports: ["1433:1433"]
    volumes: [db_mssql_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD}
    networks: [devNetwork]
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ThreatIntelligence.API/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE__CONNECTIONSTRING: Server=mssql,1433;Database=ThreatIntelligence;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      RABBITMQ__HOST: rabbitmq
      ENCRYPTION__KEYVERSION: ${ENCRYPTION__KEYVERSION:-1}
      ENCRYPTION__ROOTKEYFILE: /run/secrets/threatintel-encryption-root-key
      JWT__PRIVATEKEYFILE: /run/secrets/threatintel-jwt-private-key
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [devNetwork]
    ports: ["8080:8080"]
    volumes: [shared_logs:/app/logs]
    secrets:
      - threatintel-encryption-root-key
      - threatintel-jwt-private-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: src/ThreatIntelligence.Worker/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE__CONNECTIONSTRING: Server=mssql,1433;Database=ThreatIntelligence;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      RABBITMQ__HOST: rabbitmq
      ENCRYPTION__KEYVERSION: ${ENCRYPTION__KEYVERSION:-1}
      ENCRYPTION__ROOTKEYFILE: /run/secrets/threatintel-encryption-root-key
      JWT__PRIVATEKEYFILE: /run/secrets/threatintel-jwt-private-key
    depends_on:
      api:
        condition: service_healthy
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [devNetwork]
    ports: ["8081:8080"]
    volumes:
      - shared_logs:/app/logs
      - worker_data:/app/data
    secrets:
      - threatintel-encryption-root-key
      - threatintel-jwt-private-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks: [devNetwork]
    ports: ["${FRONTEND_PORT:-3000}:80"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  testsqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: ["test"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TEST_SQLSERVER_PASSWORD}
      MSSQL_PID: "Express"
    networks: [devNetwork]
    ports: ["1432:1433"]
    volumes: [db_testmssql_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  devNetwork:
    driver: bridge

volumes:
  db_mssql_data:
  db_testmssql_data:
  rabbitmq_data:
  worker_data:
  shared_logs:

secrets:
  threatintel-encryption-root-key:
    file: ./secrets/encryption-root-key
  threatintel-jwt-private-key:
    file: ./secrets/jwt-private-key.pem
