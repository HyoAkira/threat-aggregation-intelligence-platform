server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker DNS: resolve again after API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Preserve the full URI, including /api and query parameters.
    location ~ ^/api(?:/|$) {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Chat responses stream over SSE; report generation can take time.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Missing file requests must never receive the SPA HTML.
    location ~ /[^/]+\.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
